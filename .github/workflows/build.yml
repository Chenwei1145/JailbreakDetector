name: Build Jailbreak Detector

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ldid
        run: brew install ldid

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          mkdir -p "$HOME/theos/sdks"
          ln -s "$(xcrun --sdk iphoneos --show-sdk-path)" "$HOME/theos/sdks/iPhoneOS.sdk"

      - name: Build IOSSecuritySuite framework
        run: |
          set -euo pipefail
          rm -rf /tmp/IOSSecuritySuite /tmp/ios-security-derived
          git clone --depth 1 https://github.com/securing/IOSSecuritySuite.git /tmp/IOSSecuritySuite
          xcodebuild \
            -project /tmp/IOSSecuritySuite/IOSSecuritySuite.xcodeproj \
            -scheme IOSSecuritySuite \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath /tmp/ios-security-derived \
            -destination 'generic/platform=iOS' \
            BUILD_LIBRARY_FOR_DISTRIBUTION=YES \
            SKIP_INSTALL=NO \
            CODE_SIGNING_ALLOWED=NO
          FRAMEWORK=$(find /tmp/ios-security-derived/Build/Products -type d -path '*Release-iphoneos/IOSSecuritySuite.framework' | head -n 1)
          test -n "$FRAMEWORK" || { echo "IOSSecuritySuite.framework 未生成" >&2; exit 1; }
          mkdir -p "$GITHUB_WORKSPACE/JailbreakDetector/Resources/Frameworks"
          rm -rf "$GITHUB_WORKSPACE/JailbreakDetector/Resources/Frameworks/IOSSecuritySuite.framework"
          cp -R "$FRAMEWORK" "$GITHUB_WORKSPACE/JailbreakDetector/Resources/Frameworks/"
          echo "已嵌入：$GITHUB_WORKSPACE/JailbreakDetector/Resources/Frameworks/IOSSecuritySuite.framework"

      - name: Build IPA and DEB
        run: |
          export THEOS="$HOME/theos"
          chmod +x ./build_jailbreak_detector.sh
          set -o pipefail
          ./build_jailbreak_detector.sh 2>&1 | tee build.log

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JailbreakDetector
          path: |
            JailbreakDetector/output/*
            build.log
          if-no-files-found: warn
