name: Build Jailbreak Detector

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ldid
        run: brew install ldid

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          mkdir -p "$HOME/theos/sdks"
          ln -s "$(xcrun --sdk iphoneos --show-sdk-path)" "$HOME/theos/sdks/iPhoneOS.sdk"

      - name: Build IOSSecuritySuite framework
        run: |
          set -euo pipefail
          rm -rf /tmp/IOSSecuritySuite /tmp/ios-security-derived
          git clone --depth 1 https://github.com/securing/IOSSecuritySuite.git /tmp/IOSSecuritySuite
          cd /tmp/IOSSecuritySuite
          PROJECT=$(find . -maxdepth 2 -name '*.xcodeproj' | head -n 1)
          if [ -n "$PROJECT" ]; then
            SCHEME=$(xcodebuild -list -project "$PROJECT" | awk '/Schemes:/{f=1;next} f && NF{print $1; exit}')
            if [ -n "$SCHEME" ] && xcodebuild -project "$PROJECT" -scheme "$SCHEME" -sdk iphoneos -configuration Release \
                -derivedDataPath /tmp/ios-security-derived BUILD_LIBRARY_FOR_DISTRIBUTION=YES SKIP_INSTALL=NO; then
              FRAMEWORK=$(find /tmp/ios-security-derived -type d -name 'IOSSecuritySuite.framework' | head -n 1)
              if [ -n "$FRAMEWORK" ]; then
                mkdir -p "$GITHUB_WORKSPACE/JailbreakDetector/Resources/Frameworks"
                cp -R "$FRAMEWORK" "$GITHUB_WORKSPACE/JailbreakDetector/Resources/Frameworks/"
              fi
            fi
          fi
          echo "IOSSecuritySuite framework is optional; built-in checks remain enabled if unavailable."

      - name: Build IPA and DEB
        run: |
          export THEOS="$HOME/theos"
          chmod +x ./build_jailbreak_detector.sh
          set -o pipefail
          ./build_jailbreak_detector.sh 2>&1 | tee build.log

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JailbreakDetector
          path: |
            JailbreakDetector/output/*
            build.log
          if-no-files-found: warn
